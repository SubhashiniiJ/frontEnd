<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booksky</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
</head>

<body>
    <div class="navbar">
        <h1>Booksky</h1>
    </div>

    <div class="container">
        <div class="book-container">
            <h2>Rich Dad Poor Dad</h2>
            <h3>Robert</h3>
            <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit.
                 Possimus expedita minima quam dolorem necessitatibus quasi aspernatur aperiam nemo autem eum porro sapiente,
                  maiores, repudiandae pariatur dolorum soluta obcaecati voluptates reprehenderit.</p>
            <button onclick="deleteitem(event)">Delete</button>
        </div>
        
    </div>

    <div class="popup-overlay"></div>

    <div class="pop-up">
        <h2>Add Book</h2>
        <form>
            <input type="text" placeholder="Book Title" id="book-title-input">
            <input type="text" placeholder="Book Author" id="book-author-input">
            <textarea placeholder="Short Description" id="book-description-input"></textarea>
            <button id="add-book">Add</button>
            <button id="cancel-popup">Cancel</button>
        </form>
    </div>

    <button class="add-button" id="add-popupbutton">+</button>
    <script src="script.js"></script>
    
</body>
</html>
